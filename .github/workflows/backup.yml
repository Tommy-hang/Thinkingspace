name: Daily database backup

# Supabase 免费版【没有自动备份】。
# 这个工作流每天把整个数据库导出一次，保存为 GitHub artifact（保留 90 天）。
# 如果备份失败，GitHub 会自动给你发邮件。
#
# 需要配置一个 Secret：
#   仓库 Settings → Secrets and variables → Actions → Secrets
#   名称：SUPABASE_DB_URL
#   值：Supabase 后台 → Project Settings → Database → Connection string → URI
#       （形如 postgresql://postgres.xxxx:密码@aws-0-xxx.pooler.supabase.com:5432/postgres）

on:
  schedule:
    # UTC 18:40 = 北京时间 02:40
    - cron: '40 18 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 导出数据库
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::warning::未配置 SUPABASE_DB_URL，跳过备份。请在仓库 Secrets 里配置。"
            exit 0
          fi

          # ---- 先检查连接字符串的格式，给出人能看懂的提示 ----
          case "$DB_URL" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::连接字符串必须以 postgresql:// 开头。请到 Supabase → Project Settings → Database 复制完整的 URI。"
              exit 1
              ;;
          esac

          if printf '%s' "$DB_URL" | grep -q '\[YOUR-PASSWORD\]'; then
            echo "::error::连接字符串里还是占位符 [YOUR-PASSWORD]，请替换成你自己的数据库密码。"
            exit 1
          fi

          if printf '%s' "$DB_URL" | grep -q '[][{}]'; then
            echo "::error::连接字符串里含有方括号或花括号。"
            echo "::error::通常是密码里的特殊符号导致的。建议到 Supabase 重设一个「只含字母和数字」的数据库密码，再更新这个 Secret。"
            exit 1
          fi

          # 密码里的 @ : / ? # 等符号也必须做 URL 编码，否则会解析错
          # 简单判断：@ 只能出现在用户名和主机之间那一次
          AT_COUNT=$(printf '%s' "$DB_URL" | tr -cd '@' | wc -c)
          if [ "$AT_COUNT" -gt 1 ]; then
            echo "::error::连接字符串里出现了多个 @，说明密码里有特殊符号没有转义。"
            echo "::error::建议到 Supabase 重设一个「只含字母和数字」的数据库密码，再更新这个 Secret。"
            exit 1
          fi

          # 用 postgres:17 镜像，保证 pg_dump 版本不低于服务端
          docker run --rm -e PGURL="$DB_URL" postgres:17 \
            sh -c 'pg_dump "$PGURL" --no-owner --no-privileges' > backup.sql

          SIZE=$(wc -c < backup.sql)
          echo "备份大小：$SIZE 字节"
          head -c 300 backup.sql
          echo ""

          if [ "$SIZE" -lt 2000 ]; then
            echo "::error::备份文件异常（只有 $SIZE 字节），请检查连接字符串是否正确"
            exit 1
          fi

      - name: 保存为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: backup.sql
          retention-days: 90
